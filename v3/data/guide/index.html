<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="guide_title">Operation Mode :: Always active Window</title>
  <link rel="stylesheet" type="text/css" href="index.css">
  <!-- Localize before Chrome paints the page, while retaining English fallback markup. -->
  <script src="../i18n.js" defer blocking="render"></script>
</head>
<body>
  <h1 data-i18n="guide_heading">Operation Mode</h1>
  <fieldset>
    <legend data-i18n="guide_legend">Choose how the extension behaves</legend>
    <div id="mode">
      <input type="radio" name="mode" id="per-host" checked>
      <label for="per-host" data-i18n="guide_per_host">Enable "Always active Window" for specific tabs by clicking the action button once for each desired tab or by visiting the option page.</label>
      <input type="radio" name="mode" id="entire">
      <label for="entire" data-i18n="guide_entire">Work on all tabs (previous behavior) (not recommended)</label>
    </div>
  </fieldset>
  <p id="tools">
    <input type="button" value="Save Mode" id="save" data-i18n-value="guide_save">
  </p>
  <p id="status" role="status" aria-live="polite"></p>
  <script type="text/javascript" src="index.js"></script>
</body>
</html>
